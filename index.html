<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--s1:#111;--s2:#1a1a1a;--s3:#222;--s4:#2e2e2e;
  --border:#2a2a2a;--border2:#3a3a3a;
  --text:#f0f0f0;--muted:#777;--hint:#444;
  --acc:#e0e0e0;--acc2:#555;
  --green:#3d9970;--red:#c0392b;--amber:#d4a017;--blue:#2980b9;
  --sans:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 80px}
h1{font-size:28px;font-weight:600;letter-spacing:-1px;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:32px}

.app{width:100%;max-width:620px}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-val{font-size:22px;font-weight:600;font-family:var(--mono);color:var(--text)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.stat.done .stat-val{color:var(--green)}
.stat.pending .stat-val{color:var(--amber)}
.stat.overdue .stat-val{color:var(--red)}

/* Input card */
.input-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:16px}
.input-row{display:flex;gap:10px;margin-bottom:12px}
input[type=text]{flex:1;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;font-family:var(--sans);font-size:14px;color:var(--text);outline:none;transition:border-color .2s}
input[type=text]:focus{border-color:var(--acc2)}
input[type=text]::placeholder{color:var(--hint)}
input[type=date]{background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);padding:10px 12px;font-family:var(--mono);font-size:13px;color:var(--muted);outline:none;cursor:pointer}
input[type=date]:focus{border-color:var(--acc2)}
.meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-family:var(--sans);font-size:12px;color:var(--muted);outline:none;cursor:pointer}
select:focus{border-color:var(--acc2)}
.add-btn{margin-left:auto;background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:8px 20px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.add-btn:hover{opacity:.85}

/* Filter bar */
.filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filt-btn{background:transparent;border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-family:var(--sans);font-size:12px;color:var(--muted);cursor:pointer;transition:all .15s}
.filt-btn.active{background:var(--s3);border-color:var(--border2);color:var(--text)}
.search-wrap{margin-left:auto;position:relative}
.search-wrap input{width:160px;padding:5px 12px 5px 30px;font-size:12px;border-radius:20px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--hint);pointer-events:none}

/* Sort bar */
.sort-bar{display:flex;gap:8px;margin-bottom:16px;align-items:center}
.sort-label{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em}
.sort-btn{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 10px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s}
.sort-btn.active{border-color:var(--border2);color:var(--text);background:var(--s2)}
.clear-btn{margin-left:auto;font-size:11px;color:var(--hint);background:none;border:none;cursor:pointer;text-decoration:underline}
.clear-btn:hover{color:var(--red)}

/* Task list */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;transition:border-color .2s,opacity .2s;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.task:hover{border-color:var(--border2)}
.task.done-task{opacity:.5}
.task.done-task .task-text{text-decoration:line-through;color:var(--muted)}
.check{width:18px;height:18px;border:1.5px solid var(--border2);border-radius:5px;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent}
.check.checked{background:var(--green);border-color:var(--green)}
.check svg{display:none}
.check.checked svg{display:block}
.task-body{flex:1;min-width:0}
.task-text{font-size:14px;line-height:1.4;word-break:break-word}
.task-meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;align-items:center}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.tag.work{background:#1a2a3a;color:#5b9bd5}
.tag.personal{background:#1a2e26;color:#5dbf96}
.tag.study{background:#2e2a1a;color:#d4a34a}
.tag.health{background:#2e1a1a;color:#d46a6a}
.tag.other{background:#222;color:#888}
.priority-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.p-high{background:var(--red)}
.p-med{background:var(--amber)}
.p-low{background:var(--blue)}
.due-date{font-size:11px;color:var(--muted);font-family:var(--mono)}
.due-date.overdue{color:var(--red)}
.due-date.today{color:var(--amber)}
.task-actions{display:flex;gap:4px;flex-shrink:0;opacity:0;transition:opacity .15s}
.task:hover .task-actions{opacity:1}
.act-btn{background:transparent;border:1px solid var(--border);border-radius:6px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:all .15s}
.act-btn:hover{background:var(--s3);border-color:var(--border2);color:var(--text)}
.act-btn.del:hover{background:#2e1a1a;border-color:#5a2a2a;color:var(--red)}

/* Edit inline */
.edit-input{flex:1;background:var(--s2);border:1px solid var(--acc2);border-radius:6px;padding:4px 8px;font-family:var(--sans);font-size:14px;color:var(--text);outline:none}

/* Progress bar */
.progress-wrap{margin-bottom:20px}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.progress-track{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .4s ease}

/* Empty state */
.empty{text-align:center;padding:40px;color:var(--hint);font-size:14px}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:.3}

/* Footer */
.footer{text-align:center;margin-top:28px;font-size:11px;color:var(--hint)}
</style>
</head>
<body>

<div class="app">
  <h1>TaskFlow</h1>
  <p class="sub">Stay on top of what matters</p>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="s-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat pending"><div class="stat-val" id="s-pending">0</div><div class="stat-label">Pending</div></div>
    <div class="stat done"><div class="stat-val" id="s-done">0</div><div class="stat-label">Done</div></div>
    <div class="stat overdue"><div class="stat-val" id="s-overdue">0</div><div class="stat-label">Overdue</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-label"><span>Progress</span><span id="pct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="prog" style="width:0%"></div></div>
  </div>

  <div class="input-card">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="120"/>
      <input type="date" id="dateInput"/>
    </div>
    <div class="meta-row">
      <select id="catInput">
        <option value="other">Category</option>
        <option value="work">Work</option>
        <option value="personal">Personal</option>
        <option value="study">Study</option>
        <option value="health">Health</option>
        <option value="other">Other</option>
      </select>
      <select id="priInput">
        <option value="med">Priority</option>
        <option value="high">High</option>
        <option value="med">Medium</option>
        <option value="low">Low</option>
      </select>
      <button class="add-btn" onclick="addTask()">+ Add</button>
    </div>
  </div>

  <div class="filter-bar">
    <button class="filt-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filt-btn" onclick="setFilter('pending',this)">Pending</button>
    <button class="filt-btn" onclick="setFilter('done',this)">Done</button>
    <button class="filt-btn" onclick="setFilter('overdue',this)">Overdue</button>
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" placeholder="Search..." oninput="render()"/>
    </div>
  </div>

  <div class="sort-bar">
    <span class="sort-label">Sort:</span>
    <button class="sort-btn active" onclick="setSort('date',this)">Date added</button>
    <button class="sort-btn" onclick="setSort('due',this)">Due date</button>
    <button class="sort-btn" onclick="setSort('priority',this)">Priority</button>
    <button class="clear-btn" onclick="clearDone()">Clear completed</button>
  </div>

  <div class="tasks" id="taskList"></div>
  <div class="footer">Data saved in your browser · TaskFlow</div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem('tf_tasks')||'[]');
let filter = 'all', sortBy = 'date';

function save(){localStorage.setItem('tf_tasks',JSON.stringify(tasks))}

function addTask(){
  const text = document.getElementById('taskInput').value.trim();
  if(!text) return;
  tasks.unshift({
    id: Date.now(),
    text,
    done: false,
    cat: document.getElementById('catInput').value||'other',
    pri: document.getElementById('priInput').value||'med',
    due: document.getElementById('dateInput').value||null,
    created: Date.now()
  });
  document.getElementById('taskInput').value='';
  document.getElementById('dateInput').value='';
  document.getElementById('catInput').value='other';
  document.getElementById('priInput').value='med';
  save(); render();
}

document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

function toggleDone(id){
  const t=tasks.find(t=>t.id===id);
  if(t) t.done=!t.done;
  save(); render();
}

function deleteTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  save(); render();
}

function startEdit(id){
  const t=tasks.find(t=>t.id===id);
  if(!t) return;
  const el=document.getElementById('txt-'+id);
  const orig=el.textContent;
  const inp=document.createElement('input');
  inp.className='edit-input';
  inp.value=t.text;
  el.replaceWith(inp);
  inp.focus();
  inp.select();
  function save2(){
    const val=inp.value.trim()||orig;
    t.text=val;
    const span=document.createElement('span');
    span.className='task-text';
    span.id='txt-'+id;
    span.textContent=val;
    inp.replaceWith(span);
    save(); render();
  }
  inp.addEventListener('blur',save2);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')save2();if(e.key==='Escape'){inp.value=orig;save2();}});
}

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setSort(s,btn){
  sortBy=s;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function clearDone(){tasks=tasks.filter(t=>!t.done);save();render();}

function isOverdue(t){
  if(!t.due||t.done) return false;
  return new Date(t.due)<new Date(new Date().toDateString());
}
function isToday(t){
  if(!t.due) return false;
  return t.due===new Date().toISOString().split('T')[0];
}
function fmtDate(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-IN',{day:'numeric',month:'short'});
}

const PRI_ORDER={high:0,med:1,low:2};

function render(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  let list=[...tasks];

  if(filter==='pending') list=list.filter(t=>!t.done);
  else if(filter==='done') list=list.filter(t=>t.done);
  else if(filter==='overdue') list=list.filter(t=>isOverdue(t));
  if(q) list=list.filter(t=>t.text.toLowerCase().includes(q)||t.cat.includes(q));

  if(sortBy==='due') list.sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1);
  else if(sortBy==='priority') list.sort((a,b)=>PRI_ORDER[a.pri]-PRI_ORDER[b.pri]);
  else list.sort((a,b)=>b.created-a.created);

  const total=tasks.length, done=tasks.filter(t=>t.done).length;
  const pending=tasks.filter(t=>!t.done).length;
  const overdue=tasks.filter(t=>isOverdue(t)).length;
  document.getElementById('s-total').textContent=total;
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-pending').textContent=pending;
  document.getElementById('s-overdue').textContent=overdue;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('prog').style.width=pct+'%';

  const el=document.getElementById('taskList');
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">✓</div>${q?'No tasks match your search':'Nothing here yet'}</div>`;
    return;
  }

  el.innerHTML=list.map(t=>{
    const ov=isOverdue(t), tod=isToday(t);
    const dateLabel=t.due?`<span class="due-date ${ov?'overdue':tod?'today':''}">${ov?'Overdue · ':''}${fmtDate(t.due)}</span>`:'';
    const priClass=`p-${t.pri}`;
    return `<div class="task ${t.done?'done-task':''}" id="task-${t.id}">
      <div class="check ${t.done?'checked':''}" onclick="toggleDone(${t.id})" title="Toggle done">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="task-body">
        <span class="task-text" id="txt-${t.id}">${esc(t.text)}</span>
        <div class="task-meta">
          <div class="priority-dot ${priClass}" title="${t.pri} priority"></div>
          <span class="tag ${t.cat}">${t.cat}</span>
          ${dateLabel}
        </div>
      </div>
      <div class="task-actions">
        <button class="act-btn" onclick="startEdit(${t.id})" title="Edit">✎</button>
        <button class="act-btn del" onclick="deleteTask(${t.id})" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

render();
</script>
</body>
</html>
